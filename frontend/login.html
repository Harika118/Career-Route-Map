<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Route Map | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Career<span>Route</span>Map
        </div>

        <nav>
            <a href="index.html">Home</a>

            <a href="register.html" class="nav-button">
                Get Started
            </a>
        </nav>

    </header>


    <!-- LOGIN -->

    <main>

        <section class="login-section">

            <div class="login-container">

                <div class="login-header">

                    <span>WELCOME BACK</span>

                    <h1>Login to Your Account</h1>

                    <p>
                        Continue your personalized career journey.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="login-options">

                        <label>
                            <input
                                type="checkbox"
                                id="remember"
                            >
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login →
                    </button>


                    <p class="register-link">

                        Don't have an account?

                        <a href="register.html">
                            Create one
                        </a>

                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            Career<span>Route</span>Map
        </div>

        <p>
            AI-powered personalized career guidance platform.
        </p>

        <p class="copyright">
            © 2026 Career Route Map. All rights reserved.
        </p>

    </footer>


    <script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter your email and password.");
        return;
    }

    try {

        const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const result = await response.json();

        console.log("Server response:", result);

        if (!response.ok) {
            alert("Login failed: " + result.message);
            return;
        }

        localStorage.setItem(
            "careerRouteToken",
            result.token
        );

        localStorage.setItem(
            "careerRouteUser",
            JSON.stringify(result.user)
        );

        alert("Login successful!");

        window.location.href = "dashboard.html";

    } catch (error) {

        console.error("Login error:", error);

        alert(
            "Unable to connect to the server. " +
            "Please make sure the backend is running."
        );
    }

});
</script>

</body>

</html>
